name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # or your default branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js (optional, for JS apps)
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # Update based on your app's requirements

      - name: Build project (optional, for JS apps)
        run: |
          npm install
          npm run build  # Adjust depending on your project (if using React, Angular, etc.)

      - name: Configure Pages
        uses: actions/configure-pages@v3

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./build  # or the directory where your site files are generated

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2
